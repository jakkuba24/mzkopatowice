<script>
    const img = document.getElementById("podklad");
    const calaMapka = document.getElementById("cala_mapka");
    const zoom = document.getElementById("zoom");

    let duzyDiv = false; // Flaga wskazująca, czy div jest powiększony
	let pokazWszystkie = false;

    function zmianaRozmiaruOkna() {
		duzyDiv = false;
		if (!duzyDiv) zoom.textContent = "Powiększ mapę";
		else zoom.textContent = "Pomniejsz mapę";

        // Ustawienie szerokości i wysokości zdjęcia na 90% szerokości strony
        const imgWidth = window.innerWidth * 0.89;
		const imgHeight = window.innerHeight * 0.89;
        img.style.width = `${imgWidth}px`;
		img.style.height = `${imgHeight}px`;

        // Dopasowanie rozmiaru diva na podstawie zdjęcia
        const { width, height } = img.getBoundingClientRect();
        calaMapka.style.width = `${width}px`;
        calaMapka.style.height = `${height}px`;
		
		img.style.width = "100%";
        img.style.height = "100%";
    }

    function przyciskZoom() { //nieużywane
        if (duzyDiv) {
            const originalWidth = parseFloat(calaMapka.style.width) / 2;
			const originalHeight = parseFloat(calaMapka.style.height) / 2;
			calaMapka.style.width = `${originalWidth}px`;
			calaMapka.style.height = `${originalHeight}px`;
			zoom.textContent = "Powiększ mapę";
		} 
		else {
			const enlargedWidth = parseFloat(calaMapka.style.width) * 2;
			const enlargedHeight = parseFloat(calaMapka.style.height) * 2;
			calaMapka.style.width = `${enlargedWidth}px`;
			calaMapka.style.height = `${enlargedHeight}px`;
			zoom.textContent = "Pomniejsz mapę";
		}
        duzyDiv = !duzyDiv; // Zmień flagę
    }

    // Wywołanie przy załadowaniu strony i przy zmianie rozmiaru okna
    //zmianaRozmiaruOkna();
    //window.addEventListener("resize", zmianaRozmiaruOkna);


function aktualizacja_mapki(){
if (document.getElementById("linia2").checked) document.getElementById("mapka_linia2").style.display = "block";
else document.getElementById("mapka_linia2").style.display = "none";
if (document.getElementById("linia4").checked) document.getElementById("mapka_linia4").style.display = "block";
else document.getElementById("mapka_linia4").style.display = "none";
if (document.getElementById("linia6").checked) document.getElementById("mapka_linia6").style.display = "block";
else document.getElementById("mapka_linia6").style.display = "none";
if (document.getElementById("linia13").checked) document.getElementById("mapka_linia13").style.display = "block";
else document.getElementById("mapka_linia13").style.display = "none";
if (document.getElementById("linia16").checked) document.getElementById("mapka_linia16").style.display = "block";
else document.getElementById("mapka_linia16").style.display = "none";
if (document.getElementById("linia23").checked) document.getElementById("mapka_linia23").style.display = "block";
else document.getElementById("mapka_linia23").style.display = "none";
if (document.getElementById("linia25").checked) document.getElementById("mapka_linia25").style.display = "block";
else document.getElementById("mapka_linia25").style.display = "none";
if (document.getElementById("linia29").checked) document.getElementById("mapka_linia29").style.display = "block";
else document.getElementById("mapka_linia29").style.display = "none";
if (document.getElementById("linia53").checked) document.getElementById("mapka_linia53").style.display = "block";
else document.getElementById("mapka_linia53").style.display = "none";
}

function pokaz_ukryjLinie(){
if (!pokazWszystkie) {
	document.getElementById("linia2").checked = true;
	document.getElementById("linia4").checked = true;
	document.getElementById("linia6").checked = true;
	document.getElementById("linia13").checked = true;
	document.getElementById("linia16").checked = true;
	document.getElementById("linia23").checked = true;
	document.getElementById("linia25").checked = true;
	document.getElementById("linia29").checked = true;
	document.getElementById("linia53").checked = true;
	aktualizacja_mapki();
	document.getElementById("pokaz-all").textContent = "Ukryj wszystkie linie";
	pokazWszystkie = true;
} else {
	document.getElementById("linia2").checked = false;
	document.getElementById("linia4").checked = false;
	document.getElementById("linia6").checked = false;
	document.getElementById("linia13").checked = false;
	document.getElementById("linia16").checked = false;
	document.getElementById("linia23").checked = false;
	document.getElementById("linia25").checked = false;
	document.getElementById("linia29").checked = false;
	document.getElementById("linia53").checked = false;
	aktualizacja_mapki();
	document.getElementById("pokaz-all").textContent = "Pokaż wszystkie linie";
	pokazWszystkie = false;
}
}
